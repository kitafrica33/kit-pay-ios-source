name: Signed iOS App Store archive
run-name: Archive Kit Pay ${{ inputs.marketing_version }} (${{ inputs.build_number }})

on:
  workflow_dispatch:
    inputs:
      publication_target:
        description: Select the intended destination; TestFlight needs no marketing screenshots
        required: true
        default: testflight
        type: choice
        options: [testflight, app-store]
      update_screenshots:
        description: Prepare new store assets only when an App Store screenshot upload is needed
        required: true
        default: false
        type: boolean
      screenshot_artifact_id:
        description: Optional retained screenshot artifact to verify and reuse; otherwise discover one
        required: false
        default: ""
        type: string
      marketing_version:
        description: CFBundleShortVersionString (for example 1.0.16)
        required: true
        default: 1.0.16
        type: string
      build_number:
        description: Monotonically increasing integer CFBundleVersion
        required: true
        default: "67"
        type: string
      confirmation:
        description: Type ARCHIVE_KIT_PAY_APP_STORE
        required: true
        type: string
      corresponding_source_url:
        description: >-
          Exact public AGPL corresponding-source release URL for this build, for example
          https://github.com/kitafrica33/kit-pay-ios-source/releases/tag/v1.0.16-build67 .
          The archive is rejected unless this tagged release is already publicly available.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: kit-pay-ios-app-store-archive
  cancel-in-progress: false

jobs:
  preflight:
    name: Check publication and credentials before native setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      corresponding_source_url: ${{ steps.source.outputs.corresponding_source_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate dispatch and protected main source
        id: source
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          CORRESPONDING_SOURCE_URL: ${{ inputs.corresponding_source_url }}
          PUBLICATION_TARGET: ${{ inputs.publication_target }}
          UPDATE_SCREENSHOTS: ${{ inputs.update_screenshots }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRMATION" = 'ARCHIVE_KIT_PAY_APP_STORE'
          case "$PUBLICATION_TARGET" in testflight|app-store) ;; *) exit 1 ;; esac
          if [[ "$UPDATE_SCREENSHOTS" == 'true' ]]; then test "$PUBLICATION_TARGET" = 'app-store'; fi
          [[ "$MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          (( ${#MARKETING_VERSION} <= 64 ))
          (( ${#BUILD_NUMBER} <= 18 ))
          expected_source_url="https://github.com/kitafrica33/kit-pay-ios-source/releases/tag/v${MARKETING_VERSION}-build${BUILD_NUMBER}"
          test "$CORRESPONDING_SOURCE_URL" = "$expected_source_url"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "corresponding_source_url=$expected_source_url" >> "$GITHUB_OUTPUT"
      - name: Verify corresponding source is publicly available
        env:
          CORRESPONDING_SOURCE_URL: ${{ steps.source.outputs.corresponding_source_url }}
        run: |
          set -euo pipefail
          env -u GITHUB_TOKEN -u GH_TOKEN \
            curl --disable \
              --fail \
              --silent \
              --show-error \
              --location \
              --proto '=https' \
              --proto-redir '=https' \
              --connect-timeout 10 \
              --max-time 60 \
              --retry 2 \
              --header 'Authorization:' \
              --header 'Cookie:' \
              --output /dev/null \
              "$CORRESPONDING_SOURCE_URL"
      - name: Test shared source and release validators once
        run: python3 -m unittest discover -s .github/scripts/tests
      - name: Verify Apple publication and signing readiness
        env:
          IOS_BUNDLE_ID: africa.kit.pay.ios
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python3 .github/scripts/ios_release_readiness.py --mode archive

  archive:
    name: Sign, verify, and retain App Store artifacts
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 100
    environment: production
    env:
      IOS_BUNDLE_ID: africa.kit.pay.ios
      IOS_SHARE_BUNDLE_ID: africa.kit.pay.ios.share
      IOS_BROADCAST_BUNDLE_ID: africa.kit.pay.ios.broadcast
      IOS_APP_GROUP: group.africa.kit.pay.ios
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      CORRESPONDING_SOURCE_URL: ${{ needs.preflight.outputs.corresponding_source_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck exact selected source
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
          expected_source_url="https://github.com/kitafrica33/kit-pay-ios-source/releases/tag/v${MARKETING_VERSION}-build${BUILD_NUMBER}"
          test "$CORRESPONDING_SOURCE_URL" = "$expected_source_url"
      - name: Reuse valid store screenshots when an asset update is selected
        id: screenshots
        if: ${{ inputs.publication_target == 'app-store' && inputs.update_screenshots }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.screenshot_artifact_id }}
        run: |
          python3 .github/scripts/ios_screenshot_reuse.py reuse \
            --source-sha "$GITHUB_SHA" \
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --destination "$GITHUB_WORKSPACE/build/app-store-screenshots" \
            --xcode-version $'Xcode 26.6\nBuild version 17F113' \
            --runtime 'iOS 26.5 23F77' \
            --receipt "$RUNNER_TEMP/KitPay-screenshot-reuse.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          test "$(xcodebuild -version)" = $'Xcode 26.6\nBuild version 17F113'
      - name: Restore verified dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/org.signal.libsignal
            ~/Library/Caches/org.swift.swiftpm
          key: ios-downloads-${{ runner.os }}-${{ runner.arch }}-xcode26.6-${{ hashFiles('Podfile', '**/Package.resolved') }}
      - name: Resolve pinned native dependencies once
        run: bash .github/scripts/install_ios_dependencies.sh
      - name: Require exact App Store device classes
        if: ${{ inputs.publication_target == 'app-store' && inputs.update_screenshots && steps.screenshots.outputs.reused != 'true' }}
        id: simulators
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          def output(*arguments: str) -> dict:
              return json.loads(subprocess.check_output(arguments, text=True))

          expected_runtime = {
              "identifier": "com.apple.CoreSimulator.SimRuntime.iOS-26-5",
              "name": "iOS 26.5",
              "version": "26.5",
              "buildversion": "23F77",
          }
          runtimes = [
              runtime
              for runtime in output("xcrun", "simctl", "list", "runtimes", "available", "-j")["runtimes"]
              if runtime.get("isAvailable", True)
              and runtime.get("identifier") == expected_runtime["identifier"]
          ]
          if len(runtimes) != 1:
              raise SystemExit(
                  f"Required runtime {expected_runtime['identifier']} is unavailable or ambiguous"
              )
          runtime = runtimes[0]
          for field in ("identifier", "name", "version", "buildversion"):
              if runtime.get(field) != expected_runtime[field]:
                  raise SystemExit(
                      f"Required iOS runtime {field}={expected_runtime[field]!r}; "
                      f"found {runtime.get(field)!r}"
                  )
          device_types = output("xcrun", "simctl", "list", "devicetypes", "-j")["devicetypes"]

          def require(names: tuple[str, ...]) -> dict:
              for name in names:
                  for device_type in device_types:
                      if device_type.get("name") == name:
                          return device_type
              available = ", ".join(sorted(item.get("name", "") for item in device_types))
              raise SystemExit(f"Required device type {names} is unavailable. Available: {available}")

          iphone = require(("iPhone 14 Plus",))
          ipad = require((
              "iPad Pro 13-inch (M4)",
              "iPad Pro 13-inch (M4) (8GB)",
              "iPad Pro 13-inch (M4) (16GB)",
          ))
          print(f"runtime_id={runtime['identifier']}")
          print(f"runtime_name={runtime['name']} {runtime.get('buildversion', '')}".rstrip())
          print(f"iphone_type={iphone['identifier']}")
          print(f"ipad_type={ipad['identifier']}")
          PY
      - name: Create clean screenshot simulators
        if: ${{ inputs.publication_target == 'app-store' && inputs.update_screenshots && steps.screenshots.outputs.reused != 'true' }}
        id: devices
        env:
          RUNTIME_ID: ${{ steps.simulators.outputs.runtime_id }}
          IPHONE_TYPE: ${{ steps.simulators.outputs.iphone_type }}
          IPAD_TYPE: ${{ steps.simulators.outputs.ipad_type }}
        run: |
          set -euo pipefail
          iphone_id="$(xcrun simctl create 'KitPay App Store iPhone' "$IPHONE_TYPE" "$RUNTIME_ID")"
          ipad_id="$(xcrun simctl create 'KitPay App Store iPad' "$IPAD_TYPE" "$RUNTIME_ID")"
          [[ "$iphone_id" =~ ^[0-9A-Fa-f-]{36}$ ]]
          [[ "$ipad_id" =~ ^[0-9A-Fa-f-]{36}$ ]]
          echo "iphone_id=$iphone_id" >> "$GITHUB_OUTPUT"
          echo "ipad_id=$ipad_id" >> "$GITHUB_OUTPUT"
      - name: Prepare native test Simulator
        if: ${{ !inputs.update_screenshots || steps.screenshots.outputs.reused == 'true' }}
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(device["udid"] for devices in data.values() for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")))')"
          # Pre-answer the Contacts prompt. AppModel asks for Contacts at launch and skips it only
          # for unit-test hosts, which a UI test is not: the app runs as its own process, so the
          # system alert appears and nothing in an unattended run taps it. While that alert is up
          # the scene is not active, and the app — correctly — covers its sign-in form with
          # "Authentication details hidden", so no UI test can ever get past launch.
          xcrun simctl boot "$DEVICE_ID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$DEVICE_ID" -b >/dev/null 2>&1
          xcrun simctl privacy "$DEVICE_ID" grant contacts africa.kit.pay.ios || true
          echo "KITPAY_TEST_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Prepare the screenshot iPhone for all native checks
        if: ${{ inputs.publication_target == 'app-store' && inputs.update_screenshots && steps.screenshots.outputs.reused != 'true' }}
        env:
          DEVICE_ID: ${{ steps.devices.outputs.iphone_id }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl privacy "$DEVICE_ID" grant contacts africa.kit.pay.ios || true
          echo "KITPAY_TEST_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Compile all native tests once
        run: bash .github/scripts/ios_native_build.sh build
      - name: Run native unit and UI checks from the same build
        run: bash .github/scripts/ios_native_build.sh test
      - name: Capture iPhone 6.5-inch screenshots
        if: ${{ inputs.publication_target == 'app-store' && inputs.update_screenshots && steps.screenshots.outputs.reused != 'true' }}
        env:
          DEVICE_ID: ${{ steps.devices.outputs.iphone_id }}
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl status_bar "$DEVICE_ID" override \
            --time '9:41' \
            --operatorName 'Kit' \
            --wifiBars 3 \
            --cellularBars 4 \
            --batteryState charged \
            --batteryLevel 100
          KITPAY_TEST_DEVICE_ID="$DEVICE_ID" bash .github/scripts/ios_native_build.sh marketing-iphone
          xcrun simctl shutdown "$DEVICE_ID"
      - name: Capture iPad 13-inch screenshots
        if: ${{ inputs.publication_target == 'app-store' && inputs.update_screenshots && steps.screenshots.outputs.reused != 'true' }}
        env:
          DEVICE_ID: ${{ steps.devices.outputs.ipad_id }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl status_bar "$DEVICE_ID" override \
            --time '9:41' \
            --wifiBars 3 \
            --batteryState charged \
            --batteryLevel 100
          KITPAY_TEST_DEVICE_ID="$DEVICE_ID" bash .github/scripts/ios_native_build.sh marketing-ipad
          xcrun simctl shutdown "$DEVICE_ID"
      - name: Export, normalize, and validate screenshots
        if: ${{ inputs.publication_target == 'app-store' && inputs.update_screenshots && steps.screenshots.outputs.reused != 'true' }}
        env:
          RUNTIME_NAME: ${{ steps.simulators.outputs.runtime_name }}
        run: |
          set -euo pipefail
          evidence_root="$GITHUB_WORKSPACE/build/app-store-screenshots"
          mkdir -p "$evidence_root/xcresult-exports"

          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/KitPay-iPhone.xcresult" \
            --output-path "$evidence_root/xcresult-exports/iphone"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/KitPay-iPad.xcresult" \
            --output-path "$evidence_root/xcresult-exports/ipad"

          python3 .github/scripts/collect_xcresult_screenshots.py \
            --export-directory "$evidence_root/xcresult-exports/iphone" \
            --output-directory "$evidence_root/iphone-6.5/en-US"
          python3 .github/scripts/collect_xcresult_screenshots.py \
            --export-directory "$evidence_root/xcresult-exports/ipad" \
            --output-directory "$evidence_root/ipad-13/en-US"

          python3 .github/scripts/validate_app_store_screenshots.py \
            --root "$evidence_root" \
            --source-commit "$GITHUB_SHA" \
            --locale en-US \
            --iphone-runtime "$RUNTIME_NAME" \
            --ipad-runtime "$RUNTIME_NAME" \
            --manifest "$evidence_root/KitPay-App-Store-screenshots.json"
          mv "$RUNNER_TEMP/KitPay-iPhone.xcresult" "$evidence_root/KitPay-iPhone.xcresult"
          mv "$RUNNER_TEMP/KitPay-iPad.xcresult" "$evidence_root/KitPay-iPad.xcresult"
          python3 .github/scripts/ios_screenshot_reuse.py stamp \
            --source-sha "$GITHUB_SHA" \
            --manifest "$evidence_root/KitPay-App-Store-screenshots.json" \
            --xcode-version $'Xcode 26.6\nBuild version 17F113' \
            --runtime 'iOS 26.5 23F77'
      - name: Retain screenshots and test evidence
        if: ${{ inputs.publication_target == 'app-store' && inputs.update_screenshots && steps.screenshots.outputs.reused != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kit-pay-app-store-screenshots-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/app-store-screenshots/iphone-6.5/en-US/*.png
            build/app-store-screenshots/ipad-13/en-US/*.png
            build/app-store-screenshots/KitPay-App-Store-screenshots.json
            build/app-store-screenshots/KitPay-iPhone.xcresult
            build/app-store-screenshots/KitPay-iPad.xcresult
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain screenshot reuse evidence
        if: ${{ inputs.publication_target == 'app-store' && inputs.update_screenshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kit-pay-ios-screenshot-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/KitPay-screenshot-reuse.json
          if-no-files-found: error
          retention-days: 90
      - name: Import existing Apple distribution certificate
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID CERTIFICATE_BASE64 CERTIFICATE_PASSWORD; do
            test -n "${!name:-}"
          done

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          variable = 'CERTIFICATE_BASE64'
          encoded = ''.join(os.environ[variable].split())
          try:
              clear = base64.b64decode(encoded, validate=True)
          except (ValueError, base64.binascii.Error) as error:
              raise SystemExit(f'{variable} is not valid base64') from error
          if not clear:
              raise SystemExit(f'{variable} decoded to an empty file')
          path = root / 'kitpay-distribution.p12'
          path.write_bytes(clear)
          path.chmod(0o600)
          PY

          keychain_path="$RUNNER_TEMP/kitpay-signing.keychain-db"
          original_keychains_path="$RUNNER_TEMP/kitpay-original-keychains.txt"
          security list-keychains -d user > "$original_keychains_path"
          certificate_password="$(printf '%s' "$CERTIFICATE_PASSWORD" | tr -d '\r\n')"
          [[ "$certificate_password" =~ ^[[:xdigit:]]{64}$ ]] || {
            echo 'The certificate password must be 64 hexadecimal characters.' >&2
            exit 1
          }
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 7200 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          if ! security import "$RUNNER_TEMP/kitpay-distribution.p12" \
              -k "$keychain_path" \
              -P "$certificate_password" \
              -T /usr/bin/codesign \
              -T /usr/bin/security >/dev/null; then
            echo 'The Apple distribution identity could not be imported.' >&2
            exit 1
          fi
          unset certificate_password
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null

          original_keychains=()
          while IFS= read -r line; do
            original_keychain="${line#*\"}"
            original_keychain="${original_keychain%%\"*}"
            [[ -n "$original_keychain" ]] && original_keychains+=("$original_keychain")
          done < "$original_keychains_path"
          security list-keychains -d user -s "$keychain_path" "${original_keychains[@]}"

          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          identity_names="$(printf '%s\n' "$identities" | sed -n 's/.*"\([^"]*\)".*/\1/p' | sort -u)"
          identity_count="$(printf '%s\n' "$identity_names" | grep -Ec '^Apple Distribution:' || true)"
          team_identity_count="$(printf '%s\n' "$identity_names" | grep -Ec "^Apple Distribution:.* \\(${APPLE_TEAM_ID}\\)$" || true)"
          [[ "$identity_count" == 1 && "$team_identity_count" == 1 ]] || {
            echo "Expected exactly one valid Apple Distribution identity for ${APPLE_TEAM_ID}." >&2
            exit 1
          }

          security find-certificate -a -p "$keychain_path" \
            > "$RUNNER_TEMP/kitpay-distribution-certificate.pem"
          certificate_count="$(grep -c 'BEGIN CERTIFICATE' "$RUNNER_TEMP/kitpay-distribution-certificate.pem")"
          test "$certificate_count" = '1'
          openssl x509 \
            -in "$RUNNER_TEMP/kitpay-distribution-certificate.pem" \
            -outform der \
            -out "$RUNNER_TEMP/kitpay-distribution-certificate.der"
          test -s "$RUNNER_TEMP/kitpay-distribution-certificate.der"

      # This App Store Connect key manages bundle capabilities and profiles only.
      # It cannot import a CloudKit schema; that requires a separately confirmed
      # administrator action with a distinct CloudKit management token.
      - name: Generate fresh App Store provisioning profile
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_PRIVATE_KEY; do
            test -n "${!name:-}"
          done
          python3 .github/scripts/create_ios_app_store_profile.py \
            --bundle-id "$IOS_BUNDLE_ID" \
            --certificate-der "$RUNNER_TEMP/kitpay-distribution-certificate.der" \
            --profile-name "Kit Pay App Store ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --profile-output "$RUNNER_TEMP/kitpay-app-store.mobileprovision"
          # The share extension is a second signed bundle inside the same IPA, so it needs its own
          # App Store profile. It has no iCloud capability to enable — only the shared app group,
          # which both App IDs must already carry.
          python3 .github/scripts/create_ios_app_store_profile.py \
            --bundle-id "$IOS_SHARE_BUNDLE_ID" \
            --certificate-der "$RUNNER_TEMP/kitpay-distribution-certificate.der" \
            --profile-name "Kit Pay Share App Store ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --profile-output "$RUNNER_TEMP/kitpay-share-app-store.mobileprovision" \
            --register-bundle-name "Kit Pay Share" \
            --skip-icloud-capability \
            --skip-time-sensitive-notifications-capability
          python3 .github/scripts/create_ios_app_store_profile.py \
            --bundle-id "$IOS_BROADCAST_BUNDLE_ID" \
            --certificate-der "$RUNNER_TEMP/kitpay-distribution-certificate.der" \
            --profile-name "Kit Pay Screen Sharing App Store ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --profile-output "$RUNNER_TEMP/kitpay-broadcast-app-store.mobileprovision" \
            --register-bundle-name "Kit Pay Screen Sharing" \
            --skip-icloud-capability \
            --skip-time-sensitive-notifications-capability

      - name: Validate and install generated App Store profile
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "${APPLE_TEAM_ID:-}"
          test -s "$RUNNER_TEMP/kitpay-app-store.mobileprovision"
          test -s "$RUNNER_TEMP/kitpay-share-app-store.mobileprovision"
          security cms -D \
            -i "$RUNNER_TEMP/kitpay-app-store.mobileprovision" \
            > "$RUNNER_TEMP/kitpay-profile.plist"
          security cms -D \
            -i "$RUNNER_TEMP/kitpay-share-app-store.mobileprovision" \
            > "$RUNNER_TEMP/kitpay-share-profile.plist"
          security cms -D \
            -i "$RUNNER_TEMP/kitpay-broadcast-app-store.mobileprovision" \
            > "$RUNNER_TEMP/kitpay-broadcast-profile.plist"
          python3 .github/scripts/prepare_ios_signing.py \
            --profile-plist "$RUNNER_TEMP/kitpay-profile.plist" \
            --certificate-der "$RUNNER_TEMP/kitpay-distribution-certificate.der" \
            --bundle-id "$IOS_BUNDLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --role app \
            --app-group "$IOS_APP_GROUP" \
            --export-options "$RUNNER_TEMP/KitPayExportOptions.generated.plist" \
            --profile-uuid-output "$RUNNER_TEMP/kitpay-profile-uuid"
          # Adds the extension to the same export options mapping the app just wrote.
          python3 .github/scripts/prepare_ios_signing.py \
            --profile-plist "$RUNNER_TEMP/kitpay-share-profile.plist" \
            --certificate-der "$RUNNER_TEMP/kitpay-distribution-certificate.der" \
            --bundle-id "$IOS_SHARE_BUNDLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --role extension \
            --app-group "$IOS_APP_GROUP" \
            --export-options "$RUNNER_TEMP/KitPayExportOptions.generated.plist" \
            --profile-uuid-output "$RUNNER_TEMP/kitpay-share-profile-uuid"
          python3 .github/scripts/prepare_ios_signing.py \
            --profile-plist "$RUNNER_TEMP/kitpay-broadcast-profile.plist" \
            --certificate-der "$RUNNER_TEMP/kitpay-distribution-certificate.der" \
            --bundle-id "$IOS_BROADCAST_BUNDLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --role extension \
            --app-group "$IOS_APP_GROUP" \
            --export-options "$RUNNER_TEMP/KitPayExportOptions.generated.plist" \
            --profile-uuid-output "$RUNNER_TEMP/kitpay-broadcast-profile-uuid"

          profile_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_directory"
          profile_uuid="$(<"$RUNNER_TEMP/kitpay-profile-uuid")"
          install -m 600 \
            "$RUNNER_TEMP/kitpay-app-store.mobileprovision" \
            "$profile_directory/${profile_uuid}.mobileprovision"
          share_profile_uuid="$(<"$RUNNER_TEMP/kitpay-share-profile-uuid")"
          install -m 600 \
            "$RUNNER_TEMP/kitpay-share-app-store.mobileprovision" \
            "$profile_directory/${share_profile_uuid}.mobileprovision"
          broadcast_profile_uuid="$(<"$RUNNER_TEMP/kitpay-broadcast-profile-uuid")"
          install -m 600 \
            "$RUNNER_TEMP/kitpay-broadcast-app-store.mobileprovision" \
            "$profile_directory/${broadcast_profile_uuid}.mobileprovision"
      - name: Archive and export signed IPA
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          profile_uuid="$(<"$RUNNER_TEMP/kitpay-profile-uuid")"
          share_profile_uuid="$(<"$RUNNER_TEMP/kitpay-share-profile-uuid")"
          broadcast_profile_uuid="$(<"$RUNNER_TEMP/kitpay-broadcast-profile-uuid")"
          archive_path="$RUNNER_TEMP/KitPay.xcarchive"
          export_path="$GITHUB_WORKSPACE/build/app-store"
          mkdir -p "$export_path"

          xcodebuild \
            -workspace KitPay.xcworkspace \
            -scheme KitPay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/KitPayPackages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -archivePath "$archive_path" \
            KITPAY_APPLE_TEAM_ID="$APPLE_TEAM_ID" \
            KITPAY_PROFILE_UUID="$profile_uuid" \
            KITPAY_SHARE_PROFILE_UUID="$share_profile_uuid" \
            KITPAY_BROADCAST_PROFILE_UUID="$broadcast_profile_uuid" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            KIT_CORRESPONDING_SOURCE_URL="$CORRESPONDING_SOURCE_URL" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$RUNNER_TEMP/KitPayExportOptions.generated.plist"

          ipa_count="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')"
          test "$ipa_count" = '1'
          ipa_path="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -s "$ipa_path"
          if [[ "$ipa_path" != "$export_path/KitPay.ipa" ]]; then
            mv "$ipa_path" "$export_path/KitPay.ipa"
          fi

          test -d "$archive_path/dSYMs"
          test "$(find "$archive_path/dSYMs" -maxdepth 1 -type d -name '*.dSYM' | wc -l | tr -d ' ')" -ge 1
          ditto -c -k --sequesterRsrc --keepParent \
            "$archive_path" "$export_path/KitPay.xcarchive.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "$archive_path/dSYMs" "$export_path/KitPay.dSYMs.zip"
      - name: Verify signature, profile, entitlements, and artifact hashes
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          export_path="$GITHUB_WORKSPACE/build/app-store"
          verification_root="$RUNNER_TEMP/kitpay-ipa-verification"
          rm -rf "$verification_root"
          mkdir -p "$verification_root"
          ditto -x -k "$export_path/KitPay.ipa" "$verification_root"

          app_count="$(find "$verification_root/Payload" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          test "$app_count" = '1'
          app_path="$(find "$verification_root/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          codesign --verify --deep --strict "$app_path"
          test -s "$app_path/embedded.mobileprovision"
          security cms -D \
            -i "$app_path/embedded.mobileprovision" \
            > "$RUNNER_TEMP/kitpay-embedded-profile.plist"
          codesign -d --entitlements :- "$app_path" \
            > "$RUNNER_TEMP/kitpay-signed-entitlements.plist" 2>/dev/null

          # Both independently signed extensions must be present at the only location iOS loads.
          plugin_count="$(find "$app_path/PlugIns" -maxdepth 1 -type d -name '*.appex' | wc -l | tr -d ' ')"
          test "$plugin_count" = '2'
          extension_path="$app_path/PlugIns/KitPayShare.appex"
          test -d "$extension_path"
          test -s "$extension_path/embedded.mobileprovision"
          security cms -D \
            -i "$extension_path/embedded.mobileprovision" \
            > "$RUNNER_TEMP/kitpay-share-embedded-profile.plist"
          codesign -d --entitlements :- "$extension_path" \
            > "$RUNNER_TEMP/kitpay-share-signed-entitlements.plist" 2>/dev/null
          broadcast_extension_path="$app_path/PlugIns/KitPayBroadcast.appex"
          test -d "$broadcast_extension_path"
          test -s "$broadcast_extension_path/embedded.mobileprovision"
          security cms -D \
            -i "$broadcast_extension_path/embedded.mobileprovision" \
            > "$RUNNER_TEMP/kitpay-broadcast-embedded-profile.plist"
          codesign -d --entitlements :- "$broadcast_extension_path" \
            > "$RUNNER_TEMP/kitpay-broadcast-signed-entitlements.plist" 2>/dev/null

          profile_uuid="$(<"$RUNNER_TEMP/kitpay-profile-uuid")"
          share_profile_uuid="$(<"$RUNNER_TEMP/kitpay-share-profile-uuid")"
          broadcast_profile_uuid="$(<"$RUNNER_TEMP/kitpay-broadcast-profile-uuid")"
          python3 .github/scripts/verify_ios_archive.py \
            --app "$app_path" \
            --extension "$extension_path" \
            --extension-bundle-id "$IOS_SHARE_BUNDLE_ID" \
            --extension-profile-plist "$RUNNER_TEMP/kitpay-share-embedded-profile.plist" \
            --extension-entitlements-plist "$RUNNER_TEMP/kitpay-share-signed-entitlements.plist" \
            --expected-extension-profile-uuid "$share_profile_uuid" \
            --broadcast-extension "$broadcast_extension_path" \
            --broadcast-bundle-id "$IOS_BROADCAST_BUNDLE_ID" \
            --broadcast-profile-plist "$RUNNER_TEMP/kitpay-broadcast-embedded-profile.plist" \
            --broadcast-entitlements-plist "$RUNNER_TEMP/kitpay-broadcast-signed-entitlements.plist" \
            --expected-broadcast-profile-uuid "$broadcast_profile_uuid" \
            --app-group "$IOS_APP_GROUP" \
            --embedded-profile-plist "$RUNNER_TEMP/kitpay-embedded-profile.plist" \
            --signed-entitlements-plist "$RUNNER_TEMP/kitpay-signed-entitlements.plist" \
            --expected-profile-uuid "$profile_uuid" \
            --bundle-id "$IOS_BUNDLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --version "$MARKETING_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --corresponding-source-url "$CORRESPONDING_SOURCE_URL" \
            --ipa "$export_path/KitPay.ipa" \
            --archive-zip "$export_path/KitPay.xcarchive.zip" \
            --dsym-zip "$export_path/KitPay.dSYMs.zip" \
            --evidence "$export_path/KitPay-archive-evidence.json" \
            --source-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain verified signed archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kit-pay-ios-app-store-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/app-store/KitPay.ipa
            build/app-store/KitPay.xcarchive.zip
            build/app-store/KitPay.dSYMs.zip
            build/app-store/KitPay-archive-evidence.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Remove signing material
        if: ${{ always() }}
        run: |
          set +e
          for uuid_file in \
            "$RUNNER_TEMP/kitpay-profile-uuid" \
            "$RUNNER_TEMP/kitpay-share-profile-uuid" \
            "$RUNNER_TEMP/kitpay-broadcast-profile-uuid"; do
            if [[ -f "$uuid_file" ]]; then
              profile_uuid="$(<"$uuid_file")"
              if [[ "$profile_uuid" =~ ^[0-9A-Fa-f-]{36}$ ]]; then
                rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
              fi
            fi
          done
          security delete-keychain "$RUNNER_TEMP/kitpay-signing.keychain-db" 2>/dev/null
          rm -rf \
            "$RUNNER_TEMP/KitPay.xcarchive" \
            "$RUNNER_TEMP/kitpay-ipa-verification"
          rm -f \
            "$RUNNER_TEMP/kitpay-distribution.p12" \
            "$RUNNER_TEMP/kitpay-distribution-certificate.pem" \
            "$RUNNER_TEMP/kitpay-distribution-certificate.der" \
            "$RUNNER_TEMP/kitpay-app-store.mobileprovision" \
            "$RUNNER_TEMP/kitpay-share-app-store.mobileprovision" \
            "$RUNNER_TEMP/kitpay-broadcast-app-store.mobileprovision" \
            "$RUNNER_TEMP/kitpay-profile.plist" \
            "$RUNNER_TEMP/kitpay-share-profile.plist" \
            "$RUNNER_TEMP/kitpay-broadcast-profile.plist" \
            "$RUNNER_TEMP/kitpay-embedded-profile.plist" \
            "$RUNNER_TEMP/kitpay-share-embedded-profile.plist" \
            "$RUNNER_TEMP/kitpay-broadcast-embedded-profile.plist" \
            "$RUNNER_TEMP/kitpay-signed-entitlements.plist" \
            "$RUNNER_TEMP/kitpay-share-signed-entitlements.plist" \
            "$RUNNER_TEMP/kitpay-broadcast-signed-entitlements.plist" \
            "$RUNNER_TEMP/kitpay-profile-uuid" \
            "$RUNNER_TEMP/kitpay-share-profile-uuid" \
            "$RUNNER_TEMP/kitpay-broadcast-profile-uuid" \
            "$RUNNER_TEMP/kitpay-original-keychains.txt" \
            "$RUNNER_TEMP/kitpay-code-signing-identities.txt" \
            "$RUNNER_TEMP/KitPayExportOptions.generated.plist"

      - name: Retain native quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kit-pay-ios-quality-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/KitPay-opening-camera.xcresult
            ${{ runner.temp }}/KitPay-quality.xcresult
            ${{ runner.temp }}/KitPay-camera-pan.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Retain native UI failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kit-pay-app-store-screenshot-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/KitPay-iPhone.xcresult
            ${{ runner.temp }}/KitPay-iPad.xcresult
            build/app-store-screenshots/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Remove screenshot simulators
        if: ${{ always() }}
        env:
          IPHONE_ID: ${{ steps.devices.outputs.iphone_id }}
          IPAD_ID: ${{ steps.devices.outputs.ipad_id }}
        run: |
          set +e
          for device_id in "$IPHONE_ID" "$IPAD_ID"; do
            if [[ "$device_id" =~ ^[0-9A-Fa-f-]{36}$ ]]; then
              xcrun simctl shutdown "$device_id" 2>/dev/null
              xcrun simctl delete "$device_id" 2>/dev/null
            fi
          done
