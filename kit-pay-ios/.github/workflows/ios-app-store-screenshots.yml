name: iOS App Store screenshots
run-name: Capture App Store screenshots from ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CAPTURE_KIT_PAY_APP_STORE_SCREENSHOTS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kit-pay-ios-app-store-screenshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact dispatched source
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'CAPTURE_KIT_PAY_APP_STORE_SCREENSHOTS'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
          test -z "$(git status --short)"

      - name: Test screenshot evidence tools
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*screenshots.py'

      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.6.app
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          test "$(xcodebuild -version)" = $'Xcode 26.6\nBuild version 17F113'

      - name: Install pinned native dependencies
        run: pod install --repo-update

      - name: Require exact App Store device classes
        id: simulators
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          def output(*arguments: str) -> dict:
              return json.loads(subprocess.check_output(arguments, text=True))

          expected_runtime = {
              "identifier": "com.apple.CoreSimulator.SimRuntime.iOS-26-5",
              "name": "iOS 26.5",
              "version": "26.5",
          }
          runtimes = [
              runtime
              for runtime in output("xcrun", "simctl", "list", "runtimes", "available", "-j")["runtimes"]
              if runtime.get("isAvailable", True)
              and runtime.get("identifier") == expected_runtime["identifier"]
          ]
          if len(runtimes) != 1:
              raise SystemExit(
                  f"Required runtime {expected_runtime['identifier']} is unavailable or ambiguous"
              )
          runtime = runtimes[0]
          for field in ("identifier", "name", "version"):
              if runtime.get(field) != expected_runtime[field]:
                  raise SystemExit(
                      f"Required iOS runtime {field}={expected_runtime[field]!r}; "
                      f"found {runtime.get(field)!r}"
                  )
          device_types = output("xcrun", "simctl", "list", "devicetypes", "-j")["devicetypes"]

          def require(names: tuple[str, ...]) -> dict:
              for name in names:
                  for device_type in device_types:
                      if device_type.get("name") == name:
                          return device_type
              available = ", ".join(sorted(item.get("name", "") for item in device_types))
              raise SystemExit(f"Required device type {names} is unavailable. Available: {available}")

          iphone = require(("iPhone 14 Plus",))
          ipad = require((
              "iPad Pro 13-inch (M4)",
              "iPad Pro 13-inch (M4) (8GB)",
              "iPad Pro 13-inch (M4) (16GB)",
          ))
          print(f"runtime_id={runtime['identifier']}")
          print(f"runtime_name={runtime['name']} {runtime.get('buildversion', '')}".rstrip())
          print(f"iphone_type={iphone['identifier']}")
          print(f"ipad_type={ipad['identifier']}")
          PY

      - name: Create clean screenshot simulators
        id: devices
        env:
          RUNTIME_ID: ${{ steps.simulators.outputs.runtime_id }}
          IPHONE_TYPE: ${{ steps.simulators.outputs.iphone_type }}
          IPAD_TYPE: ${{ steps.simulators.outputs.ipad_type }}
        run: |
          set -euo pipefail
          iphone_id="$(xcrun simctl create 'KitPay App Store iPhone' "$IPHONE_TYPE" "$RUNTIME_ID")"
          ipad_id="$(xcrun simctl create 'KitPay App Store iPad' "$IPAD_TYPE" "$RUNTIME_ID")"
          [[ "$iphone_id" =~ ^[0-9A-Fa-f-]{36}$ ]]
          [[ "$ipad_id" =~ ^[0-9A-Fa-f-]{36}$ ]]
          echo "iphone_id=$iphone_id" >> "$GITHUB_OUTPUT"
          echo "ipad_id=$ipad_id" >> "$GITHUB_OUTPUT"

      - name: Capture iPhone 6.5-inch screenshots
        env:
          DEVICE_ID: ${{ steps.devices.outputs.iphone_id }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl status_bar "$DEVICE_ID" override \
            --time '9:41' \
            --operatorName 'Kit' \
            --wifiBars 3 \
            --cellularBars 4 \
            --batteryState charged \
            --batteryLevel 100
          xcodebuild \
            -workspace KitPay.xcworkspace \
            -scheme KitPay \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/KitPayScreenshotDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/KitPay-iPhone.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:KitPayUITests/AppStoreScreenshotUITests/testCaptureAppStoreScreenshots \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) APP_STORE_SCREENSHOTS' \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER= \
            DEVELOPMENT_TEAM= \
            clean test
          xcrun simctl shutdown "$DEVICE_ID"

      - name: Capture iPad 13-inch screenshots
        env:
          DEVICE_ID: ${{ steps.devices.outputs.ipad_id }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl status_bar "$DEVICE_ID" override \
            --time '9:41' \
            --wifiBars 3 \
            --batteryState charged \
            --batteryLevel 100
          xcodebuild \
            -workspace KitPay.xcworkspace \
            -scheme KitPay \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/KitPayScreenshotDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/KitPay-iPad.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:KitPayUITests/AppStoreScreenshotUITests/testCaptureAppStoreScreenshots \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) APP_STORE_SCREENSHOTS' \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER= \
            DEVELOPMENT_TEAM= \
            test
          xcrun simctl shutdown "$DEVICE_ID"

      - name: Export, normalize, and validate screenshots
        env:
          RUNTIME_NAME: ${{ steps.simulators.outputs.runtime_name }}
        run: |
          set -euo pipefail
          evidence_root="$GITHUB_WORKSPACE/build/app-store-screenshots"
          mkdir -p "$evidence_root/xcresult-exports"

          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/KitPay-iPhone.xcresult" \
            --output-path "$evidence_root/xcresult-exports/iphone"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/KitPay-iPad.xcresult" \
            --output-path "$evidence_root/xcresult-exports/ipad"

          python3 .github/scripts/collect_xcresult_screenshots.py \
            --export-directory "$evidence_root/xcresult-exports/iphone" \
            --output-directory "$evidence_root/iphone-6.5/en-US"
          python3 .github/scripts/collect_xcresult_screenshots.py \
            --export-directory "$evidence_root/xcresult-exports/ipad" \
            --output-directory "$evidence_root/ipad-13/en-US"

          python3 .github/scripts/validate_app_store_screenshots.py \
            --root "$evidence_root" \
            --source-commit "$GITHUB_SHA" \
            --locale en-US \
            --iphone-runtime "$RUNTIME_NAME" \
            --ipad-runtime "$RUNTIME_NAME" \
            --manifest "$evidence_root/KitPay-App-Store-screenshots.json"
          mv "$RUNNER_TEMP/KitPay-iPhone.xcresult" "$evidence_root/KitPay-iPhone.xcresult"
          mv "$RUNNER_TEMP/KitPay-iPad.xcresult" "$evidence_root/KitPay-iPad.xcresult"

      - name: Retain screenshots and test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kit-pay-app-store-screenshots-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/app-store-screenshots/iphone-6.5/en-US/*.png
            build/app-store-screenshots/ipad-13/en-US/*.png
            build/app-store-screenshots/KitPay-App-Store-screenshots.json
            build/app-store-screenshots/KitPay-iPhone.xcresult
            build/app-store-screenshots/KitPay-iPad.xcresult
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove screenshot simulators
        if: ${{ always() }}
        env:
          IPHONE_ID: ${{ steps.devices.outputs.iphone_id }}
          IPAD_ID: ${{ steps.devices.outputs.ipad_id }}
        run: |
          set +e
          for device_id in "$IPHONE_ID" "$IPAD_ID"; do
            if [[ "$device_id" =~ ^[0-9A-Fa-f-]{36}$ ]]; then
              xcrun simctl shutdown "$device_id" 2>/dev/null
              xcrun simctl delete "$device_id" 2>/dev/null
            fi
          done
